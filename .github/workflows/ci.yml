build-scan-push:
  needs: test
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4

    - name: Nom d'image en minuscules (exigence GHCR)
      id: img
      run: echo "repo=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/helpdesk-api" >> $GITHUB_OUTPUT

    - name: Construire l'image
      run: docker build -t helpdesk-api:ci ./api

    - name: Scan Trivy - bloquant sur CRITICAL corrigeable
      uses: aquasecurity/trivy-action@0.28.0
      with:
        image-ref: helpdesk-api:ci
        severity: CRITICAL
        ignore-unfixed: true
        exit-code: "1"

    - name: Rapport Trivy HIGH+CRITICAL (informatif)
      uses: aquasecurity/trivy-action@0.28.0
      with:
        image-ref: helpdesk-api:ci
        severity: HIGH,CRITICAL
        exit-code: "0"

    - name: Connexion à GHCR
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Tag et push
      if: github.event_name != 'pull_request'
        run: |
          REPO=${{ steps.img.outputs.repo }}
          docker tag helpdesk-api:ci $REPO:sha-${GITHUB_SHA::7}
          docker tag helpdesk-api:ci $REPO:latest
          docker push $REPO:sha-${GITHUB_SHA::7}
          docker push $REPO:latest